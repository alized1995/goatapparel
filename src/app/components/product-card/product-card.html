<div class="card product-card h-100 bg-transparent text-white border-0">
    <div class="position-relative overflow-hidden product-img-wrapper">
        <img [src]="product.image" class="card-img-top" [alt]="product.name">
        <div class="product-overlay d-flex align-items-center justify-content-center">
            <button class="btn btn-light rounded-circle p-3 zoom-btn" (click)="viewProduct.emit(product)">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>
    <div class="card-body px-0 pt-3">
        <h5 class="card-title text-uppercase fw-bold ls-1">{{product.name}}</h5>
        <!-- Price Removed -->
    </div>
</div>

<style>
    .product-img-wrapper {
        border-radius: 4px;
        background: #1a1a1a;
    }

    .card-img-top {
        transition: transform 0.5s ease;
        width: 100%;
        aspect-ratio: 3/4;
        object-fit: cover;
    }

    .product-card:hover .card-img-top {
        transform: scale(1.05);
    }

    .product-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.3);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .product-card:hover .product-overlay {
        opacity: 1;
    }

    .ls-1 {
        letter-spacing: 1px;
    }

    .zoom-btn {
        transition: transform 0.3s ease;
    }

    .zoom-btn:hover {
        transform: scale(1.1);
    }
</style>
